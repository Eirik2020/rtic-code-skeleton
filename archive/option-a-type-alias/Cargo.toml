[package]
name = "rtic-code-skeleton"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7.9"
cortex-m-rt = "0.7.6"
panic-halt = "1.0.0"
rtic = { version = "2.3.1", features = ["thumbv7-backend"] }
stm32f4xx-hal = { version = "0.23.0" }

[features]
default = []
chip-f401 = ["stm32f4xx-hal/stm32f401"]
chip-f405 = ["stm32f4xx-hal/stm32f405"]
board-a = []
board-b = []
